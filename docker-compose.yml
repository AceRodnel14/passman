# Self-hosting: docker compose pull && docker compose up -d
# Development:  docker compose up --build
services:
  app:
    image: ${IMAGE:-eacer/passman:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-passman}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-passman}?sslmode=disable
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      - db
    # The image's HEALTHCHECK already runs. Uncomment to change its timings.
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passman}
      # Must be set in .env before the first start (blank or unset: Compose refuses to start).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-passman}
    volumes:
      - pg-data:/var/lib/postgresql
    # No healthcheck: passman starts without Postgres and retries with backoff; /readyz
    # is 503 until the database is reachable.
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-passman}"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5

volumes:
  pg-data:
