include:
  # - 'https://gitlab.com/acerodnel/gitlab-actions/-/raw/main/templates/sync_to_github.yml'
  # - 'https://gitlab.com/acerodnel/gitlab-actions/-/raw/main/templates/build_container_images_all.yml'
  - project: 'acerodnel/gitlab-actions'
    file: 'templates/lint_all.yml'
  - project: 'acerodnel/gitlab-actions'
    file: 'templates/sync_to_github.yml'
  - project: 'acerodnel/gitlab-actions'
    file: 'templates/build_container_images_dockerhub.yml'

stages:
  - validate
  - build
  - sync
  - cleanup
variables:
  # The Go jobs compile `//go:embed all:web/dist`; a stub keeps them independent of the frontend build.
  GO_PREPARE: "mkdir -p web/dist && touch web/dist/index.html"
